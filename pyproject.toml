[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgerigar"
version = "0.1.0"
description = "Causal streaming listen-and-repeat speech model"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchaudio>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["gradio>=5.0", "matplotlib>=3.8"]
data = ["librosa>=0.10", "soundfile>=0.12"]

[tool.setuptools.packages.find]
include = ["budgerigar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
