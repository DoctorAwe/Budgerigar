[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgerigar"
version = "0.1.0"
description = "Causal any-to-one streaming speech conversion research toolkit"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2", "torchaudio>=2.2"]
dev = ["pytest>=8"]
demo = ["gradio>=5"]
data = ["datasets[audio]>=3.0"]

[project.scripts]
budgerigar-audit = "budgerigar.manifest:main"
budgerigar-prepare = "budgerigar.data_prep:main"
budgerigar-features = "budgerigar.features:main"
budgerigar-train-echo = "budgerigar.train_echo:main"
budgerigar-evaluate-echo = "budgerigar.evaluate_echo:main"
budgerigar-evaluate-content = "budgerigar.evaluate_content:main"
budgerigar-train-hierarchical = "budgerigar.train_hierarchical:main"
budgerigar-train-content-memory = "budgerigar.train_content_memory:main"

[tool.setuptools.packages.find]
include = ["budgerigar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
