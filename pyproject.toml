[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgerigar"
version = "0.1.0"
description = "Causal any-to-one streaming speech conversion research toolkit"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2", "torchaudio>=2.2"]
dev = ["pytest>=8"]
demo = ["gradio>=5"]

[project.scripts]
budgerigar-audit = "budgerigar.manifest:main"
budgerigar-prepare = "budgerigar.data_prep:main"

[tool.setuptools.packages.find]
include = ["budgerigar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
